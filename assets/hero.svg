<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc">
<title id="title">Niloy Chandra Datta — Software Engineer, Product Builder and AI Systems Explorer</title>
<desc id="desc">Premium midnight-blue banner with cyan-violet aurora, fine technical grid, and geometric system motif.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#070D1C"/><stop offset=".56" stop-color="#0B1731"/><stop offset="1" stop-color="#15123B"/></linearGradient>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#5EEAD4"/><stop offset=".44" stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop stop-color="#F8FAFC"/><stop offset=".75" stop-color="#DEE8FF"/><stop offset="1" stop-color="#B8C5FF"/></linearGradient>
  <radialGradient id="aurora"><stop stop-color="#2563EB" stop-opacity=".34"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
  <radialGradient id="violet"><stop stop-color="#8B5CF6" stop-opacity=".32"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" stroke="#94A3B8" stroke-opacity=".07" fill="none" stroke-width="1"/></pattern>
  <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#D8EAFE" opacity=".08"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="1440" height="430" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
