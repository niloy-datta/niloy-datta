 <text x="57" y="324" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="19" fill="#8FCDFF" letter-spacing="3">BACKEND  /  DISTRIBUTED SYSTEMS  /  AI</text>
 <text x="57" y="366" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#D6E4F5">From complex ideas to useful products.</text>
