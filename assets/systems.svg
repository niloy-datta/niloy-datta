<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="278" viewBox="0 0 1440 278" role="img" aria-labelledby="title desc">
<title id="title">How I think about software systems</title><desc id="desc">A connected four-stage diagram: Product Experience, Backend Services, Data and Events, Infrastructure. Reliability, observability, and security form a common foundation.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091427"/><stop offset="1" stop-color="#151638"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#5EEAD4"/><stop offset=".5" stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" stroke="#CBD5E1" stroke-opacity=".055" fill="none"/></pattern>
</defs>
<rect x="0" y="0" width="1440" height="278" rx="18" fill="url(#bg)"/>
<rect width="1440" height="278" rx="18" fill="url(#grid)"/>
<text x="42" y="43" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#8DBBEE" letter-spacing="3" font-weight="700">FROM EXPERIENCE TO INFRASTRUCTURE</text>
<text x="42" y="76" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#F8FAFC" font-weight="700">One connected engineering mindset.</text>
